name: dementia_care

description: "AI-Based Cognitive Gaming and Memory Assistance Platform for Elderly Dementia Patients in North Eastern Region (NER)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.1.0
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.10.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  firebase_auth: ^6.7.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#EAF6EF"
  image: assets/app_icon.png
  android: true
  ios: true
  web: false